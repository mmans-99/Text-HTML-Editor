<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="theme-color-meta" content="#0f172a">
    <title>Android TXT/HTML Editor</title>
    <style>
/* ===== Offline replacement for Tailwind CDN (only the classes this app uses) ===== */
*,::before,::after{box-sizing:border-box;border:0 solid #e2e8f0}
html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{margin:0}
button,select,textarea,input{font-family:inherit;font-size:100%;line-height:inherit;color:inherit;margin:0}
button{background:transparent;padding:0;cursor:pointer}
textarea{padding:0}
svg{display:block}
/* layout */
.flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}
.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.shrink-0{flex-shrink:0}.relative{position:relative}.absolute{position:absolute}.fixed{position:fixed}
.inset-0{top:0;right:0;bottom:0;left:0}
.bottom-12{bottom:3rem}.left-1\/2{left:50%}.z-50{z-index:50}
.transform.-translate-x-1\/2{transform:translateX(-50%)}
.overflow-hidden{overflow:hidden}.overflow-auto{overflow:auto}.overflow-x-auto{overflow-x:auto}
.whitespace-nowrap{white-space:nowrap}
.cursor-pointer{cursor:pointer}.pointer-events-none{pointer-events:none}
.opacity-0{opacity:0}
.w-full{width:100%}.h-full{height:100%}
.h-\[var\(--app-height\)\]{height:var(--app-height)}
.w-4{width:1rem}.h-4{height:1rem}.w-5{width:1.25rem}.h-5{height:1.25rem}
/* spacing */
.p-2{padding:.5rem}.p-3{padding:.75rem}.p-0\.5{padding:.125rem}
.px-1{padding-left:.25rem;padding-right:.25rem}.px-1\.5{padding-left:.375rem;padding-right:.375rem}
.px-2{padding-left:.5rem;padding-right:.5rem}.px-2\.5{padding-left:.625rem;padding-right:.625rem}
.px-3{padding-left:.75rem;padding-right:.75rem}.px-3\.5{padding-left:.875rem;padding-right:.875rem}
.px-4{padding-left:1rem;padding-right:1rem}
.py-0\.5{padding-top:.125rem;padding-bottom:.125rem}.py-1{padding-top:.25rem;padding-bottom:.25rem}
.py-1\.5{padding-top:.375rem;padding-bottom:.375rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}
.py-3{padding-top:.75rem;padding-bottom:.75rem}.pr-2{padding-right:.5rem}
.space-x-1>*+*{margin-left:.25rem}.space-x-1\.5>*+*{margin-left:.375rem}.space-x-2>*+*{margin-left:.5rem}
/* text */
.text-xs{font-size:.75rem;line-height:1rem}.text-sm{font-size:.875rem;line-height:1.25rem}
.text-\[10px\]{font-size:10px}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.font-medium{font-weight:500}.font-bold{font-weight:700}
.text-right{text-align:right}.leading-relaxed{line-height:1.625}
/* text colors */
.text-white{color:#fff}
.text-slate-100{color:#f1f5f9}.text-slate-200{color:#e2e8f0}.text-slate-300{color:#cbd5e1}
.text-slate-400{color:#94a3b8}.text-slate-500{color:#64748b}.text-slate-600{color:#475569}
.text-slate-700{color:#334155}.text-slate-800{color:#1e293b}
.text-purple-200{color:#e9d5ff}
/* backgrounds */
.bg-white{background:#fff}.bg-transparent{background:transparent}
.bg-slate-100{background:#f1f5f9}.bg-slate-200{background:#e2e8f0}.bg-slate-300{background:#cbd5e1}
.bg-slate-700{background:#334155}.bg-slate-800{background:#1e293b}.bg-slate-900{background:#0f172a}
.bg-slate-800\/80{background:rgba(30,41,59,.8)}.bg-slate-800\/90{background:rgba(30,41,59,.9)}
.bg-slate-900\/90{background:rgba(15,23,42,.9)}
.bg-purple-600{background:#9333ea}.bg-purple-700{background:#7e22ce}.bg-purple-900\/60{background:rgba(88,28,135,.6)}
/* borders */
.border{border-width:1px}.border-b{border-bottom-width:1px}.border-t{border-top-width:1px}.border-r{border-right-width:1px}
.border-slate-300{border-color:#cbd5e1}.border-slate-600{border-color:#475569}
.border-slate-700{border-color:#334155}.border-slate-800{border-color:#1e293b}
.border-slate-700\/60{border-color:rgba(51,65,85,.6)}.border-purple-700\/50{border-color:rgba(126,34,206,.5)}
.rounded{border-radius:.25rem}.rounded-md{border-radius:.375rem}.rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}
.shadow{box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06)}
.shadow-sm{box-shadow:0 1px 2px rgba(0,0,0,.05)}
.shadow-2xl{box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.outline-none{outline:2px solid transparent;outline-offset:2px}
/* interaction */
.select-none{-webkit-user-select:none;user-select:none}
.hover\:bg-slate-600:hover{background:#475569}.hover\:bg-slate-400:hover{background:#94a3b8}
.hover\:bg-purple-500:hover{background:#a855f7}.hover\:bg-purple-800:hover{background:#6b21a8}
.hover\:text-white:hover{color:#fff}.hover\:text-slate-200:hover{color:#e2e8f0}
.hover\:bg-slate-600:hover{background:#475569}
.focus\:ring-2:focus{box-shadow:0 0 0 2px #a855f7}
.active\:scale-95:active{transform:scale(.95)}
.transition{transition-property:color,background-color,border-color,opacity,box-shadow,transform;transition-duration:.15s}
.transition-colors{transition-property:color,background-color,border-color;transition-duration:.15s}
.transition-all{transition-property:all;transition-duration:.15s}
.transition-opacity{transition-property:opacity;transition-duration:.15s}
.duration-200{transition-duration:.2s}.duration-300{transition-duration:.3s}
.hidden{display:none!important}
/* light-mode fix: original left the text nearly invisible on a light background */
#body-container.bg-slate-100 #editor-textarea{color:#1e293b}
#body-container.bg-slate-100 #line-numbers{background:rgba(226,232,240,.9)}
/* ===== end offline CSS ===== */
</style>
    <style>
        :root {
            --app-height: 100vh;
        }
        @supports (height: 100dvh) {
            :root {
                --app-height: 100dvh;
            }
        }
        html, body {
            height: var(--app-height);
            overflow: hidden;
            overscroll-behavior-y: none;
            touch-action: pan-x pan-y;
            -webkit-user-select: none;
            user-select: none;
        }
        textarea, input, select {
            -webkit-user-select: text;
            user-select: text;
        }
        .safe-area-top {
            padding-top: env(safe-area-inset-top);
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        /* Unified Grid Scroll Container to prevent WebView desync */
        .editor-grid {
            display: grid;
            grid-template-columns: 48px 1fr;
            height: 100%;
            overflow-y: auto;
            overflow-x: auto;
            position: relative;
        }
        #line-numbers {
            overflow: hidden;
            pointer-events: none;
            user-select: none;
        }
        #editor-textarea {
            resize: none;
            outline: none;
            background: transparent;
            white-space: pre;
            overflow-x: auto;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150,150,150,0.4);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col justify-between h-[var(--app-height)] overflow-hidden safe-area-top safe-area-bottom transition-colors duration-200" id="body-container">

    <!-- Top Navigation Header -->
    <header class="flex items-center justify-between px-3 py-2 bg-slate-800 border-b border-slate-700 select-none shrink-0">
        <div class="flex items-center space-x-2">
            <div class="relative">
                <select id="file-extension" class="bg-slate-900 border border-slate-600 text-slate-100 text-sm rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-purple-500 outline-none font-mono">
                    <option value="html">.HTML</option>
                    <option value="txt">.TXT</option>
                    <option value="css">.CSS</option>
                    <option value="js">.JS</option>
                    <option value="json">.JSON</option>
                </select>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Theme Toggle -->
            <button id="theme-toggle" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 active:scale-95 transition" title="Toggle Light/Dark Mode">
                <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>

            <!-- Copy Button Fallback -->
            <button id="copy-btn" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 active:scale-95 transition" title="Copy Content">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
            </button>

            <!-- Open File -->
            <label class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 cursor-pointer active:scale-95 transition" title="Open File">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"></path></svg>
                <input type="file" id="file-input" class="hidden">
            </label>

            <!-- Save File Button -->
            <button id="save-btn" class="flex items-center space-x-1.5 bg-purple-600 hover:bg-purple-500 text-white font-medium px-3.5 py-1.5 rounded-lg shadow active:scale-95 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span class="text-sm">Save</span>
            </button>
        </div>
    </header>

    <!-- Sub Header Controls -->
    <div class="flex items-center justify-between px-3 py-1.5 bg-slate-800/80 border-b border-slate-700/60 text-xs shrink-0 select-none">
        <!-- Mode Tabs -->
        <div class="flex items-center bg-slate-900 rounded-lg p-0.5 border border-slate-700">
            <button id="tab-editor" class="px-3 py-1 rounded-md font-medium bg-purple-600 text-white transition">Editor</button>
            <button id="tab-preview" class="px-3 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition">Preview</button>
        </div>

        <!-- Editor Options -->
        <div class="flex items-center space-x-2">
            <button id="wrap-toggle" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded transition font-mono">No Wrap</button>
            <div class="flex items-center space-x-1 bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5">
                <button id="font-dec" class="px-1 text-slate-300 hover:text-white font-bold">-</button>
                <span id="font-size-display" class="font-mono text-slate-300">14px</span>
                <button id="font-inc" class="px-1 text-slate-300 hover:text-white font-bold">+</button>
            </div>
        </div>
    </div>

    <!-- Quick Touch Symbol Toolbar -->
    <div id="symbol-bar" class="flex items-center overflow-x-auto space-x-1 px-2 py-1.5 bg-slate-800/90 border-b border-slate-700/60 shrink-0 whitespace-nowrap">
        <button onclick="insertCode('<!DOCTYPE html>\n<html>\n<head>\n\t<title></title>\n</head>\n<body>\n\t\n</body>\n</html>', true)" class="px-2 py-1 bg-purple-900/60 hover:bg-purple-800 text-purple-200 rounded text-xs font-mono font-bold border border-purple-700/50">&lt;!&gt;</button>
        <span class="text-slate-600">|</span>
        <span class="text-xs text-slate-400 font-mono px-1">SYMBOLS:</span>
        <button onclick="insertCode('&lt;')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">&lt;</button>
        <button onclick="insertCode('&gt;')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">&gt;</button>
        <button onclick="insertCode('/')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">/</button>
        <button onclick="insertCode('=')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">=</button>
        <button onclick="insertCode('&quot;&quot;', 1)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">"</button>
        <button onclick="insertCode(&quot;''&quot;, 1)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">'</button>
        <button onclick="insertCode('{}', 1)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">{}</button>
        <button onclick="insertCode('[]', 1)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">[]</button>
        <button onclick="insertCode('&lt;div&gt;&lt;/div&gt;', 6)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">&lt;div&gt;</button>
        <button onclick="insertCode('&lt;p&gt;&lt;/p&gt;', 3)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">&lt;p&gt;</button>
        <button onclick="insertCode('&lt;h1&gt;&lt;/h1&gt;', 4)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-mono">&lt;h1&gt;</button>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 relative flex overflow-hidden">
        
        <!-- Editor View Container (Grid architecture locks line numbers & text together) -->
        <div id="editor-container" class="absolute inset-0 editor-grid bg-slate-900" id="main-scroller">
            <!-- Line Numbers Gutter -->
            <div id="line-numbers" class="py-3 bg-slate-900/90 text-slate-500 font-mono text-xs text-right pr-2 border-r border-slate-800">1</div>
            
            <!-- Code Textarea -->
            <textarea id="editor-textarea" class="w-full h-full bg-transparent text-slate-100 p-3 font-mono text-sm leading-relaxed" placeholder="Type text or HTML code here ..."></textarea>
        </div>

        <!-- Live Preview Container -->
        <div id="preview-container" class="absolute inset-0 hidden bg-white flex flex-col">
            <div class="bg-slate-200 px-3 py-1 flex items-center justify-between border-b border-slate-300 text-xs text-slate-700">
                <span class="font-bold">Live Preview Mode</span>
                <div class="space-x-2">
                    <button onclick="setPreviewMode('mobile')" class="px-2 py-0.5 bg-slate-300 hover:bg-slate-400 rounded">Phone</button>
                    <button onclick="setPreviewMode('full')" class="px-2 py-0.5 bg-slate-300 hover:bg-slate-400 rounded">Full</button>
                </div>
            </div>
            <div class="flex-1 flex justify-center items-center p-2 bg-slate-100 overflow-auto">
                <iframe id="preview-frame" class="w-full h-full bg-white border border-slate-300 rounded shadow-sm transition-all duration-300"></iframe>
            </div>
        </div>

    </main>

    <!-- Footer Status Bar -->
    <footer class="flex items-center justify-between px-3 py-1 bg-slate-800 border-t border-slate-700 text-xs text-slate-400 select-none shrink-0 font-mono">
        <div id="cursor-pos">Ln 1, Col 1</div>
        <div id="char-count">0 chars</div>
        <div class="text-[10px] text-slate-500">MOBILE CODE EDITOR</div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-12 left-1/2 transform -translate-x-1/2 bg-slate-900 border border-slate-700 text-slate-100 px-4 py-2 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-sm font-medium">
        Saved!
    </div>

    <!-- JavaScript Logic -->
    <script>
        const editor = document.getElementById('editor-textarea');
        const lineNumbers = document.getElementById('line-numbers');
        const editorContainer = document.getElementById('editor-container');
        const cursorInfo = document.getElementById('cursor-pos');
        const charCount = document.getElementById('char-count');
        const extensionSelect = document.getElementById('file-extension');
        const saveBtn = document.getElementById('save-btn');
        const copyBtn = document.getElementById('copy-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const bodyContainer = document.getElementById('body-container');
        const themeMeta = document.getElementById('theme-color-meta');
        
        const tabEditor = document.getElementById('tab-editor');
        const tabPreview = document.getElementById('tab-preview');
        const previewContainer = document.getElementById('preview-container');
        const previewFrame = document.getElementById('preview-frame');
        const wrapToggle = document.getElementById('wrap-toggle');
        const fontInc = document.getElementById('font-inc');
        const fontDec = document.getElementById('font-dec');
        const fontSizeDisplay = document.getElementById('font-size-display');

        let currentFontSize = 14;
        let isDarkMode = true;

        editor.value = "";

        function updateLineNumbers() {
            const lines = editor.value.split('\n').length;
            let nums = '';
            for (let i = 1; i <= lines; i++) {
                nums += i + '<br>';
            }
            lineNumbers.innerHTML = nums;
        }

        function updateCursor() {
            const pos = editor.selectionStart;
            const textBefore = editor.value.substring(0, pos);
            const lines = textBefore.split('\n');
            const ln = lines.length;
            const col = lines[lines.length - 1].length + 1;
            cursorInfo.innerText = `Ln ${ln}, Col ${col}`;
            charCount.innerText = `${editor.value.length} chars`;
        }

        editor.addEventListener('input', () => {
            updateLineNumbers();
            updateCursor();
            saveToLocalStorage();
        });

        editor.addEventListener('click', updateCursor);
        editor.addEventListener('keyup', updateCursor);

        // Word Wrap Toggle
        let isWrapped = false;
        wrapToggle.addEventListener('click', () => {
            isWrapped = !isWrapped;
            if (isWrapped) {
                editor.style.whiteSpace = 'pre-wrap';
                editor.style.overflowX = 'hidden';
                wrapToggle.innerText = 'Wrap On';
                wrapToggle.classList.replace('bg-slate-700', 'bg-purple-700');
            } else {
                editor.style.whiteSpace = 'pre';
                editor.style.overflowX = 'auto';
                wrapToggle.innerText = 'No Wrap';
                wrapToggle.classList.replace('bg-purple-700', 'bg-slate-700');
            }
        });

        // Font Size Adjustment
        fontInc.addEventListener('click', () => {
            if (currentFontSize < 24) {
                currentFontSize += 2;
                editor.style.fontSize = currentFontSize + 'px';
                lineNumbers.style.fontSize = currentFontSize + 'px';
                fontSizeDisplay.innerText = currentFontSize + 'px';
            }
        });

        fontDec.addEventListener('click', () => {
            if (currentFontSize > 10) {
                currentFontSize -= 2;
                editor.style.fontSize = currentFontSize + 'px';
                lineNumbers.style.fontSize = currentFontSize + 'px';
                fontSizeDisplay.innerText = currentFontSize + 'px';
            }
        });

        window.insertCode = function(text, cursorOffset = 0) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const val = editor.value;
            editor.value = val.substring(0, start) + text + val.substring(end);
            editor.focus();
            editor.selectionStart = editor.selectionEnd = start + text.length - cursorOffset;
            updateLineNumbers();
            updateCursor();
        };

        tabEditor.addEventListener('click', () => {
            tabEditor.className = "px-3 py-1 rounded-md font-medium bg-purple-600 text-white transition";
            tabPreview.className = "px-3 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition";
            editorContainer.classList.remove('hidden');
            previewContainer.classList.add('hidden');
        });

        tabPreview.addEventListener('click', () => {
            tabPreview.className = "px-3 py-1 rounded-md font-medium bg-purple-600 text-white transition";
            tabEditor.className = "px-3 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition";
            previewContainer.classList.remove('hidden');
            editorContainer.classList.add('hidden');
            
            const blob = new Blob([editor.value], { type: 'text/html' });
            previewFrame.src = URL.createObjectURL(blob);
        });

        window.setPreviewMode = function(mode) {
            if (mode === 'mobile') {
                previewFrame.style.maxWidth = '375px';
                previewFrame.style.maxHeight = '667px';
            } else {
                previewFrame.style.maxWidth = '100%';
                previewFrame.style.maxHeight = '100%';
            }
        };

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                bodyContainer.className = "bg-slate-900 text-slate-100 flex flex-col justify-between h-[var(--app-height)] overflow-hidden safe-area-top safe-area-bottom transition-colors duration-200";
                editorContainer.className = "absolute inset-0 editor-grid bg-slate-900";
                themeMeta.content = "#0f172a";
            } else {
                bodyContainer.className = "bg-slate-100 text-slate-800 flex flex-col justify-between h-[var(--app-height)] overflow-hidden safe-area-top safe-area-bottom transition-colors duration-200";
                editorContainer.className = "absolute inset-0 editor-grid bg-slate-100";
                themeMeta.content = "#f1f5f9";
            }
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(editor.value).then(() => {
                showToast('Copied to clipboard!');
            });
        });

        saveBtn.addEventListener('click', () => {
            const ext = extensionSelect.value;
            const filename = `document.${ext}`;
            const mimeTypes = {
                'html': 'text/html',
                'txt': 'text/plain',
                'css': 'text/css',
                'js': 'application/javascript',
                'json': 'application/json'
            };
            
            const blob = new Blob([editor.value], { type: mimeTypes[ext] || 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast(`Saved ${filename}`);
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                editor.value = e.target.result;
                updateLineNumbers();
                updateCursor();
                showToast(`Opened ${file.name}`);
            };
            reader.readAsText(file);
        });

        function saveToLocalStorage() {
            localStorage.setItem('mobile_editor_content', editor.value);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        updateLineNumbers();
    </script>
</body>
</html>
